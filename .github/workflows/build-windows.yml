name: Build DIABLO Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Validate catalog and run tests
        shell: pwsh
        run: |
          python tools/validate_catalog.py
          python -m unittest discover -s tools -p "test_*.py"
          python -m py_compile main.py tools/validate_catalog.py tools/test_installer.py

      - name: Build standalone application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "DIABLO_666_MODPACK_EU" `
            --icon "assets/diablo_icon.ico" `
            --collect-all PIL `
            --version-file "installer/version_info.txt" `
            --add-data "catalog.json;." `
            --add-data "assets;assets" `
            --add-data "packages;packages" `
            main.py
          New-Item -ItemType Directory -Force "dist/app" | Out-Null
          Copy-Item "dist/DIABLO_666_MODPACK_EU.exe" "dist/app/DIABLO_666_MODPACK_EU.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build user-facing Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "installer/DIABLO_666_MODPACK_EU.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Sign Setup EXE (optional Authenticode certificate)
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "diablo-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signTool) { throw "Windows SDK signtool.exe not found" }
            $setup = "dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe"
            & $signTool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            Remove-Item $pfx -Force
          } else {
            Write-Host "No signing certificate configured; building an unsigned community installer."
          }

      - name: Create checksums and release manifest
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          $setup = "dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe" | Set-Content "$setup.sha256"
          $signature = if ($env:WINDOWS_CERTIFICATE_BASE64) { "Authenticode signed" } else { "unsigned" }
          @"
          Product: DIABLO_666 MODPACK EU
          Version: 0.6.1
          Platform: Windows x64
          Installer: Inno Setup 6
          Signature: $signature
          Third-party mod binaries: not bundled
          "@ | Set-Content "dist/installer/RELEASE_INFO.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIABLO_666_MODPACK_EU_Setup_v0.6.1_Windows_x64
          if-no-files-found: error
          path: |
            dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe
            dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe.sha256
            dist/installer/RELEASE_INFO.txt

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe" `
            "dist/installer/DIABLO_666_MODPACK_EU_Setup_v0.6.1.exe.sha256" `
            "dist/installer/RELEASE_INFO.txt" `
            --title "DIABLO_666 MODPACK EU 0.6.1" `
            --notes "Windows x64 community installer. See RELEASE_INFO.txt for signature status. Third-party mod binaries are not redistributed."
